name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Newman
        run: npm install -g newman

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore backend dependencies
        working-directory: backend
        run: dotnet restore

      - name: Build backend
        working-directory: backend
        run: dotnet build --no-restore -c Release

      - name: Run backend tests
        working-directory: backend
        run: dotnet test --no-build --no-restore -c Release

      - name: Start database
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: docker compose up -d

      - name: Wait for SQL Server to be ready
        run: |
          for i in {1..30}; do
            if docker logs customersupport-sql 2>&1 | grep -q "SQL Server is now ready for client connections"; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 5
          done
          echo "SQL Server did not become ready in time"
          docker logs customersupport-sql || true
          exit 1

      - name: Start backend API
        working-directory: backend
        env:
          CONNECTION_STRING: ${{ secrets.CONNECTION_STRING }}
          JWT_KEY: ${{ secrets.JWT_KEY }}
          Jwt__Issuer: ${{ secrets.JWT_ISSUER }}
          Jwt__Audience: ${{ secrets.JWT_AUDIENCE }}
        run: |
          nohup dotnet run --project ./CustomerSupport.API/CustomerSupport.API.csproj > api.log 2>&1 &

      - name: Wait for API health check
        working-directory: backend
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:5132/health > /dev/null; then
              echo "API health check is ready"
              exit 0
            fi
            sleep 5
          done
          echo "API did not start in time"
          cat api.log || true
          exit 1

      - name: Check metrics endpoint
        run: |
          echo "Health response:"
          curl -s http://localhost:5132/health
          echo
          echo "Metrics response:"
          curl -s http://localhost:5132/metrics
          echo

      - name: Run Postman collection with Newman
        run: |
          newman run docs/postman/CustomerSupport.postman_collection.json --env-var "baseUrl=http://localhost:5132"